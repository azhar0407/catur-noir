<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catur Noir</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="lobby">
  <h1 id="logo">Catur <span>Noir</span></h1>
  <p class="tagline">Duel catur realtime — tanpa akun, cukup bagikan tautan.</p>
  <div class="rule"></div>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 8l7-5 7 5M7 21h10" stroke-linecap="round" stroke-linejoin="round"/></svg>Buat Ruang</h2>
    <button id="btn-create" class="primary">Buat Ruang PvP</button>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 18.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Gabung Ruang</h2>
    <div class="row">
      <input id="inp-code" maxlength="4" placeholder="KODE" autocomplete="off" aria-label="Kode ruang 4 huruf">
      <button id="btn-join">Gabung</button>
    </div>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>Main vs Komputer</h2>
    <div class="row">
      <select id="sel-level" aria-label="Level komputer">
        <option value="1">Level 1 — mudah</option>
        <option value="3" selected>Level 3</option>
        <option value="6">Level 6</option>
        <option value="10">Level 10 — sulit</option>
      </select>
      <button id="btn-bot">Main</button>
    </div>
  </section>

  <p class="lobby-foot">noir · tanpa akun · tanpa cookie pelacak</p>
</main>
<div id="toast-box"></div>
<script src="/js/app.js"></script>
</body>
</html>
